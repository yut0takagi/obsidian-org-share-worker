name = "obsidian-org-share-worker"
main = "src/index.ts"
compatibility_date = "2026-05-30"

# Replace bucket_name with your R2 bucket name before deploy.
[[r2_buckets]]
binding = "R2"
bucket_name = "your-bucket-name"

[vars]
# Update to your org's email domain (used by "Org-wide" share mode).
ORG_DOMAIN = "example.com"
